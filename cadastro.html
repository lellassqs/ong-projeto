<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Cadastre-se para participar das ações da ONG Esperança e Solidariedade.">

    <title>Cadastro | ONG Esperança e Solidariedade</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <header>

        <div class="header-container">

            <button
                type="button"
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="menu-principal">

                ☰ Menu

            </button>

            <nav aria-label="Navegação principal">

                <ul class="menu" id="menu-principal">

                    <li class="menu-item">
                        <a href="index.html">
                            Início
                        </a>
                    </li>

                    <li class="menu-item dropdown">

                        <a href="projetos.html">
                            Projetos
                        </a>

                        <ul class="dropdown-menu">

                            <li>
                                <a href="projetos.html#doacao">
                                    Doações
                                </a>
                            </li>

                            <li>
                                <a href="projetos.html#voluntariado">
                                    Voluntariado
                                </a>
                            </li>

                        </ul>

                    </li>

                    <li class="menu-item">
                        <a href="cadastro.html">
                            Participe
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main>

        <div class="grid-12">

            <section class="grid-full">

                <h1>
                    Faça parte da nossa causa
                </h1>

                <p>
                    Preencha o formulário para demonstrar seu interesse
                    em colaborar com a ONG.
                </p>


                <div
                    id="form-alert"
                    class="alert"
                    role="alert"
                    hidden>
                </div>


                <form
                    action="#"
                    method="post"
                    id="formulario-cadastro">


                    <!-- DADOS PESSOAIS -->

                    <fieldset>

                        <legend>
                            Dados pessoais
                        </legend>


                        <p>

                            <label for="nome">
                                Nome completo:
                            </label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                minlength="3"
                                maxlength="100"
                                required>

                            <span
                                id="erro-nome"
                                class="mensagem-campo">
                            </span>

                        </p>


                        <p>

                            <label for="cpf">
                                CPF:
                            </label>

                            <input
                                type="text"
                                id="cpf"
                                name="cpf"
                                placeholder="000.000.000-00"
                                maxlength="14"
                                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                                title="Digite o CPF no formato 000.000.000-00"
                                required>

                            <span
                                id="erro-cpf"
                                class="mensagem-campo">
                            </span>

                        </p>


                        <p>

                            <label for="email">
                                E-mail:
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="seuemail@email.com"
                                required>

                            <span
                                id="erro-email"
                                class="mensagem-campo">
                            </span>

                        </p>


                        <p>

                            <label for="telefone">
                                Telefone:
                            </label>

                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="(00) 00000-0000"
                                maxlength="15"
                                pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                                title="Digite o telefone no formato (00) 00000-0000"
                                required>

                            <span
                                id="erro-telefone"
                                class="mensagem-campo">
                            </span>

                        </p>


                        <p>

                            <label for="nascimento">
                                Data de nascimento:
                            </label>

                            <input
                                type="date"
                                id="nascimento"
                                name="nascimento"
                                required>

                        </p>

                    </fieldset>


                    <!-- ENDEREÇO -->

                    <fieldset>

                        <legend>
                            Endereço
                        </legend>


                        <p>

                            <label for="cep">
                                CEP:
                            </label>

                            <input
                                type="text"
                                id="cep"
                                name="cep"
                                placeholder="00000-000"
                                maxlength="9"
                                pattern="[0-9]{5}-[0-9]{3}"
                                title="Digite o CEP no formato 00000-000"
                                required>

                        </p>


                        <p>

                            <label for="endereco">
                                Endereço:
                            </label>

                            <input
                                type="text"
                                id="endereco"
                                name="endereco"
                                maxlength="150"
                                required>

                        </p>


                        <p>

                            <label for="numero">
                                Número:
                            </label>

                            <input
                                type="number"
                                id="numero"
                                name="numero"
                                min="1"
                                required>

                        </p>


                        <p>

                            <label for="cidade">
                                Cidade:
                            </label>

                            <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                maxlength="100"
                                required>

                        </p>


                        <p>

                            <label for="estado">
                                Estado:
                            </label>

                            <input
                                type="text"
                                id="estado"
                                name="estado"
                                maxlength="50"
                                required>

                        </p>

                    </fieldset>


                    <!-- INTERESSE -->

                    <fieldset>

                        <legend>
                            Interesse em colaborar
                        </legend>


                        <p>

                            <label for="interesse">
                                Como deseja colaborar?
                            </label>

                            <select
                                id="interesse"
                                name="interesse"
                                required>

                                <option value="">
                                    Selecione uma opção
                                </option>

                                <option value="voluntariado">
                                    Voluntariado
                                </option>

                                <option value="doacao">
                                    Doação
                                </option>

                                <option value="divulgacao">
                                    Divulgação
                                </option>

                            </select>

                        </p>


                        <p>

                            <label for="mensagem">
                                Mensagem:
                            </label>

                            <textarea
                                id="mensagem"
                                name="mensagem"
                                rows="5"
                                maxlength="500"
                                placeholder="Conte como gostaria de colaborar.">
                            </textarea>

                        </p>

                    </fieldset>


                    <!-- ACEITE -->

                    <p>

                        <input
                            type="checkbox"
                            id="aceite"
                            name="aceite"
                            required>

                        <label for="aceite">
                            Concordo em fornecer meus dados para contato.
                        </label>

                    </p>


                    <button
                        type="submit"
                        class="botao"
                        id="botao-enviar">

                        Quero participar

                    </button>

                </form>

            </section>

        </div>

    </main>


    <footer>

        <p>
            &copy; 2026 ONG Esperança e Solidariedade.
            Todos os direitos reservados.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
